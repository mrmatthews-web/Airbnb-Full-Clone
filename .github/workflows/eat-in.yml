name: Eat In prototype checks
on:
  push:
    branches: [eat-in-development]
  pull_request:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @airbnb-clone/database generate
      - run: pnpm --filter web test:demo
      - run: pnpm --filter web exec eslint .
      - run: pnpm --filter web build
      - run: node apps/web/tests/private-preview.mjs
      - run: pnpm --filter api-gateway build
      - run: pnpm --filter api-gateway exec jest --runInBand
